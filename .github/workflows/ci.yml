name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        # Pinned deliberately. The formatter's output changes between releases —
        # 0.1.20261020 removes the trailing comma after the last enum field,
        # later builds add it — so an unpinned CI would fail `moon fmt --check`
        # on a repository that is correctly formatted for the toolchain the
        # code was written against. Bump this together with a local `moon fmt`.
        run: |
          MOONBIT_INSTALL_VERSION=0.1.20261020 \
            bash -c "$(curl -fsSL https://cli.moonbitlang.cn/install/unix.sh)"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: moon version --all

      - name: Format is clean
        run: moon fmt --check

      - name: Check, with warnings treated as errors
        run: moon check --deny-warn

      - name: Test
        run: moon test

      - name: Defect demos
        run: moon run cmd/main
