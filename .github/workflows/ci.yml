name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: moon version --all

      # Formatting is deliberately not gated. The formatter's output moves
      # between toolchain releases — 0.1.20261020 drops the trailing comma
      # after the last enum payload field, later builds add it — so a
      # `moon fmt --check` gate fails on correctly formatted code as soon as
      # the runner installs a newer toolchain, and pinning the toolchain is not
      # an option because that exact build is not published for Linux.
      # The checks below are the ones that catch real defects.

      - name: Check, with warnings treated as errors
        run: moon check --deny-warn

      - name: Test
        run: moon test

      - name: Defect demos
        run: moon run cmd/main
